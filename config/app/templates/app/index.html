
{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'app/css/styles.css' %}">
   <link href="
https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css
" rel="stylesheet">

    <title>Mi aplicación</title>
</head>

<body>
    <main class = "container">
        <aside class = "aside">
            <div class = "logo_container">
                <!--<i class="bi bi-book"></i>-->
                <h3>Sitio del congreso</h3>
                <p>Gestion</p>
                
            </div>

            <div class = "menu_container">
                <div class = "menu_tile">
                    <i class="bi bi-person"></i>
                    <p>Perfil</p>
                </div>
                <div class = "menu_tile">
                    <i class="bi bi-file-earmark-check"></i>
                    <p>Mis trabajos</p>
                </div>
                <div class = "menu_tile">
                    <i class="bi bi-card-checklist"></i>
                    <p>Evaluar trabajos</p>
                </div>
                <div class = "menu_tile">
                    <i class="bi bi-bell"></i>
                    <p>Notificaciones</p>
                </div>
            </div>
        </aside>


        
        <div class = "main_container">
            <div class = "view view_evaluar">
                <header class = "header_evaluar">
                    <div class = "titles_evaluar">
                        <h3>Evaluar ponencias</h3>
                        <p>La inteligencia artificial como prometeo digital</p>
                    </div>
                    <div class = "status_evaluar">
                        <div class = "badge_evaluar">
                            <i class="bi bi-circle-fill"></i>
                            <p>EN REVISÓN</p>
                        </div>
                    </div>
                </header>
                <div class = "main_container_evaluar">
                    <iframe src="{% static 'app/documents/resumen.pdf' %}" width="50%" height="400px">
                        <p>Tu navegador no es compatible con la visualización de PDF. 
                        Puedes <a href="tu-archivo.pdf">descargar el archivo aquí</a>.</p>
                    </iframe>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
